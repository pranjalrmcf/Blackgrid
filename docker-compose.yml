name: blackgrid
services:
  blackgrid:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: blackgrid:phase7
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: [api]
    init: true
    user: "10001:10001"
    read_only: true
    networks: [api-local]
    ports:
      - "127.0.0.1:8765:8765"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 40s
    # No automatic restart/analysis loop; the operator inspects failures first.
    restart: "no"
    environment:
      BLACKGRID_ENV: production
      BLACKGRID_CONFIG: /app/configs/collegemsg_sprint01.json
      BLACKGRID_DATA_ROOT: /app
      BLACKGRID_EVIDENCE_ROOT: /app/evidence
      BLACKGRID_BENCHMARK_RESULTS_DIR: /app/benchmark-results
      BLACKGRID_RUNS_DIR: /app/runs
      BLACKGRID_PORT: "8765"
      BLACKGRID_SHUTDOWN_GRACE_SECONDS: "30"
      BLACKGRID_CAPABILITIES: community
      BLACKGRID_API_HOST: "0.0.0.0"
      BLACKGRID_API_ALLOWED_HOSTS: "127.0.0.1,localhost"
      BLACKGRID_API_CREDENTIALS_FILE: /run/secrets/clients.json
      BLACKGRID_API_TLS_CERTFILE: /run/secrets/server-cert.pem
      BLACKGRID_API_TLS_KEYFILE: /run/secrets/server-key.pem
      BLACKGRID_API_LIVE_POLICY_FILE: /run/secrets/live-policy.json
    volumes:
      - type: bind
        source: ./results/production_phase6
        target: /app/benchmark-results
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - blackgrid-state:/app/runs
      # Frozen aggregate evidence only: no prediction arrays, labels or raw data.
      - type: bind
        source: ./runs/sprint6-v1/selection.json
        target: /app/evidence/prediction/selection.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs/sprint6-v1/freeze.json
        target: /app/evidence/prediction/freeze.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs/sprint6-v1/validation.json
        target: /app/evidence/prediction/validation.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs/sprint6-v1/test_evaluation.json
        target: /app/evidence/prediction/test_evaluation.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs/sprint6-v1/predictions_manifest.json
        target: /app/evidence/prediction/predictions_manifest.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./results/sprint06-v2/summary.json
        target: /app/evidence/rolling/summary.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./results/sprint06-v3-bitcoin/summary.json
        target: /app/evidence/confirmation/summary.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs/sprint7-final
        target: /app/evidence/research
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/clients.json
        target: /run/secrets/clients.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/server-cert.pem
        target: /run/secrets/server-cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/server-key.pem
        target: /run/secrets/server-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/live-policy.json
        target: /run/secrets/live-policy.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.secrets/openrouter-key.txt
        target: /run/secrets/openrouter-key.txt
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777
networks:
  api-local:
    driver: bridge
volumes:
  blackgrid-state:
