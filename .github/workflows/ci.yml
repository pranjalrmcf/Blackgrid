name: Release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build locked verification and production images
        run: |
          mkdir -p tmp/release-ci/evidence
          docker build --target test -t blackgrid:release-test .
          docker build --target production -t blackgrid:phase9 .
      - name: Lint, format and scoped strict typing
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 2g --cpus 1 --pids-limit 128
          --tmpfs /tmp:size=512m,mode=1777 --entrypoint python
          blackgrid:release-test scripts/release_gate.py quality
      - name: Offline regression and API/security contracts
        run: |
          chmod a+w tmp/release-ci tmp/release-ci/evidence
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:size=512m,mode=1777 \
            --mount type=bind,source="$PWD/tmp/release-ci",target=/evidence \
            blackgrid:release-test -o addopts= -q -p no:cacheprovider \
            --basetemp=/tmp/pytest --junitxml=/evidence/regression.xml
          docker run --rm --network none --read-only --tmpfs /tmp:size=64m \
            --mount type=bind,source="$PWD/tmp/release-ci",target=/evidence,readonly \
            --entrypoint python blackgrid:release-test scripts/release_gate.py junit --folder /evidence
      - name: Isolated staging and recovery
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 2g --cpus 1 --pids-limit 128
          --tmpfs /tmp:size=512m,mode=1777
          --mount type=bind,source="$PWD/tmp/release-ci/evidence",target=/evidence
          --entrypoint python blackgrid:release-test -m scripts.verify_phase9
      - name: Scan exact runtime image without private data
        run: |
          docker save -o /tmp/blackgrid-release.tar blackgrid:phase9
          # Dropped capabilities prevent overriding the archive owner's file permissions.
          chmod 0644 /tmp/blackgrid-release.tar
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --cpus 1 --pids-limit 128 --tmpfs /tmp:size=768m,mode=1777 \
            --mount type=bind,source=/tmp/blackgrid-release.tar,target=/input/image.tar,readonly \
            --mount type=bind,source="$PWD/tmp/release-ci/evidence",target=/evidence \
            --mount type=volume,source=trivy-cache,target=/cache \
            aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --cache-dir /cache --scanners vuln --pkg-types os,library --list-all-pkgs \
            --format json --output /evidence/scan_phase9.json --input /input/image.tar --timeout 10m --quiet
          docker run --rm --read-only --mount type=volume,source=trivy-cache,target=/cache aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 --cache-dir /cache version --format json > tmp/release-ci/evidence/scanner_version.json
          python3 scripts/package_release.py --ci --output tmp/release-ci/evidence
      - name: Enforce restricted release gates
        run: |
          IMAGE_ID=$(docker image inspect blackgrid:phase9 --format '{{.Id}}')
          docker run --rm --network none --read-only --tmpfs /tmp:size=64m \
            --mount type=bind,source="$PWD/tmp/release-ci",target=/evidence,readonly \
            --entrypoint python blackgrid:release-test scripts/release_gate.py assess \
            --folder /evidence --image-id "$IMAGE_ID" --scope local-restricted
      - name: Retain synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checks-${{ github.sha }}
          path: |
            tmp/release-ci/regression.xml
            tmp/release-ci/evidence/scan_phase9.json
            tmp/release-ci/evidence/scan_summary.json
            tmp/release-ci/evidence/staging.json
            tmp/release-ci/evidence/restore_drill.json
            tmp/release-ci/evidence/release_manifest.json
          retention-days: 14
          if-no-files-found: error
