<title>BLACKGRID · Investigation Console</title>
<style>
:root{--bg:#04060c;--panel:#0a1020d9;--line:#1d2a44;--text:#d8e4ff;--muted:#8090b5;--cyan:#3ef0ff;--magenta:#ff3ecf;
--lime:#7dff9a;--amber:#ffc43e;--red:#ff5470;--node:#4d7cff;--hub:#3ef0ff;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;padding:0 16px 48px;
background-image:linear-gradient(rgba(62,240,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(62,240,255,.045) 1px,transparent 1px);background-size:36px 36px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% -10%,rgba(62,240,255,.14),transparent 55%),radial-gradient(ellipse at 110% 10%,rgba(255,62,207,.10),transparent 50%)}
.wrap{max-width:1280px;margin:0 auto;position:relative}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding:20px 0 14px;border-bottom:1px solid var(--line)}
.brand{font:700 13px/1 ui-monospace,"Cascadia Code",Consolas,monospace;letter-spacing:.32em;color:var(--cyan);text-shadow:0 0 14px rgba(62,240,255,.6);cursor:pointer;text-decoration:none}
.brand small{display:block;margin-top:6px;letter-spacing:.18em;color:var(--muted);font-weight:400}
.mode{margin-left:auto;font:600 11px ui-monospace,Consolas,monospace;letter-spacing:.16em;display:flex;align-items:center;gap:8px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:p 2s infinite}
.dot.off{background:var(--muted);box-shadow:none;animation:none}
@keyframes p{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.dot{animation:none}}
h1{font-size:21px;margin:0;font-weight:600;overflow-wrap:anywhere}
h2{font:600 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin:0 0 14px;display:flex;gap:10px;align-items:center}
h2:before{content:"";width:8px;height:8px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.grid{display:grid;gap:16px;margin-top:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.panel{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel:after{content:"";position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);border-radius:6px 0 0 0}
@media(min-width:900px){.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font:600 11px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;border:1px solid;white-space:nowrap}
.ok{color:var(--lime);border-color:var(--lime)}.warn{color:var(--amber);border-color:var(--amber)}.bad{color:var(--red);border-color:var(--red)}.neutral{color:var(--cyan);border-color:var(--cyan)}
.badge.ok{box-shadow:0 0 10px rgba(125,255,154,.3)}.badge.warn{box-shadow:0 0 10px rgba(255,196,62,.25)}.badge.bad{box-shadow:0 0 10px rgba(255,84,112,.3)}.badge.neutral{box-shadow:0 0 10px rgba(62,240,255,.25)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:rgba(62,240,255,.03)}
.stat b{display:block;font:600 22px/1.15 ui-monospace,Consolas,monospace;color:#fff;margin-top:3px}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono,code,td.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}.muted{color:var(--muted)}.small{font-size:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace}
svg{width:100%;height:auto;display:block;user-select:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:1px solid transparent;border-bottom:none;color:var(--muted);padding:8px 14px;font:600 12px ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:6px 6px 0 0}
.tab:hover{color:var(--text)}.tab.on{color:var(--cyan);border-color:var(--line);background:var(--panel);box-shadow:0 -2px 0 var(--cyan) inset}
.btn{background:rgba(62,240,255,.08);border:1px solid var(--cyan);color:var(--cyan);padding:7px 14px;border-radius:5px;font:600 12px ui-monospace,Consolas,monospace;letter-spacing:.1em;cursor:pointer;text-transform:uppercase}
.btn:hover{background:rgba(62,240,255,.18)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.danger{border-color:var(--red);color:var(--red);background:rgba(255,84,112,.08)}.btn.warnb{border-color:var(--amber);color:var(--amber);background:rgba(255,196,62,.08)}
select,input[type=text],input[type=search]{background:#0b1222;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:5px;font:13px ui-monospace,Consolas,monospace}
input[type=range]{accent-color:var(--cyan)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11px ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(62,240,255,.05)}
.tablewrap{overflow-x:auto}
.stepper{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.step{flex:1 1 90px;padding:7px 6px;border:1px solid var(--line);border-radius:4px;font:600 10px ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;text-align:center;color:var(--muted)}
.step.done{border-color:rgba(125,255,154,.5);color:var(--lime)}.step.now{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(62,240,255,.35)}.step.stop{border-color:var(--amber);color:var(--amber)}
.notice{border:1px dashed var(--amber);color:var(--amber);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:10px}
.notice.info{border-color:var(--cyan);color:var(--cyan)}
.claim{border-left:3px solid var(--lime);padding:8px 12px;margin:8px 0;background:rgba(125,255,154,.04);border-radius:0 6px 6px 0}
.claim.rej{border-color:var(--red);background:rgba(255,84,112,.05)}.claim .why{color:var(--red);font-size:12px;margin-top:4px}.claim .ev{color:var(--muted);font-size:11px;margin-top:4px;overflow-wrap:anywhere}
.meter{margin:10px 0}.meter-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter-track{height:6px;background:#111a2e;border-radius:6px;overflow:hidden;margin-top:4px}.meter-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 10px var(--cyan);transition:width .6s}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px dashed var(--line)}
.timeline li{position:relative;padding:4px 0 10px 12px}.timeline li:before{content:"";position:absolute;left:-24px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--cyan)}
.timeline li.fail:before{border-color:var(--red)}.timeline li.warn:before{border-color:var(--amber)}
.timeline .t{font:600 12px ui-monospace,Consolas,monospace;color:var(--cyan);letter-spacing:.08em;cursor:pointer}
.timeline .detail{display:none;margin-top:6px}.timeline li.open .detail{display:block}
.tip{position:fixed;pointer-events:none;background:#0b1222;border:1px solid var(--cyan);color:var(--text);padding:6px 9px;border-radius:4px;font:12px ui-monospace,Consolas,monospace;z-index:9;box-shadow:0 0 14px rgba(62,240,255,.3);display:none;max-width:320px}
.hist rect.bar{fill:rgba(62,240,255,.55)}.hist rect.bar:hover{fill:var(--cyan)}.hist .band{fill:rgba(62,240,255,.07)}
.obs{stroke:var(--magenta);stroke-width:2.5}.obs-label{fill:var(--magenta);font:12px ui-monospace,Consolas,monospace}
.axis{stroke:var(--line)}.tick{fill:var(--muted);font:11px ui-monospace,Consolas,monospace}
.net line{stroke:rgba(140,170,255,.28);stroke-width:1}.net circle{cursor:pointer}.net circle.dim{opacity:.15}
.strip circle{fill:var(--cyan);opacity:.85;cursor:pointer}.strip circle.v-supported{fill:var(--lime)}.strip circle.v-abstain,.strip circle.v-inconclusive{fill:var(--amber)}
.toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:10}
.toast div{background:#0b1222;border:1px solid var(--cyan);padding:10px 14px;border-radius:6px;font:12px ui-monospace,Consolas,monospace;max-width:360px;box-shadow:0 0 16px rgba(62,240,255,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{cursor:pointer;opacity:.5}.chip.on{opacity:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
a{color:var(--cyan)}a:hover{color:#fff}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
.bars .bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 8px rgba(62,240,255,.4)}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" id="home">BLACKGRID<small>Network research workspace</small></a>
    <div id="title"></div>
    <div class="mode"><span class="dot" id="dot"></span><span id="modelabel"></span></div>
  </header>
  <main id="app"></main>
  <footer>Local workspace. Node references stay on this computer; AI receives aggregate evidence only.</footer>

<script>
"use strict";
const BOOT = JSON.parse(document.getElementById("bg-boot").textContent);
const LIVE = BOOT.mode === "live";
const STAGES = ["initialize","authorize","plan","validate","execute","check_evidence","analyst","critic","reviser","finalize"];
const TONE = {supported:"ok",completed:"ok",not_supported:"neutral",running:"neutral",inconclusive:"warn",abstain:"warn",abstained:"warn",partial:"warn",paused:"warn",rejected:"bad",failed:"bad",cancelled:"bad",denied:"bad",budget_exhausted:"bad",mock:"neutral"};
const app = document.getElementById("app");
let timer = null, current = null, tab = "overview";

// ---- tiny safe DOM helpers (all untrusted text goes through textContent) ----
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === "cls") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false)
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const NS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids){
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (v !== null && v !== undefined) el.setAttribute(k, String(v));
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined)
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const f3 = v => (typeof v === "number" ? v.toFixed(3) : (v ?? "—"));
const f2 = v => (typeof v === "number" ? v.toFixed(2) : (v ?? "—"));
const badge = v => h("span", {cls: "badge " + (TONE[v] || "neutral")}, String(v ?? "—").replace(/_/g, " "));
const tip = document.getElementById("tip");
function showTip(e, text){ tip.textContent = text; tip.style.display = "block"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip(){ tip.style.display = "none"; }
function toast(text, cls){ const d = h("div", {cls: cls || ""}, text); document.getElementById("toast").appendChild(d); setTimeout(() => d.remove(), 6000); }

// ---- data access: live API or the embedded snapshot ----
async function api(path, body){
  const opts = body ? {method: "POST", headers: {"Content-Type": "application/json", "X-Blackgrid-Token": BOOT.token}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
function href(kind, id){
  if (LIVE) return kind === "index" ? "#/" : `#/${kind}/${encodeURIComponent(id)}`;
  if (kind === "index") return BOOT.base + "index.html";
  return BOOT.base + id + (kind === "pilot" ? "/pilot.html" : kind === "forecast" ? "/forecast.html" : "/report.html");
}
async function load(kind, id){
  if (!LIVE) return BOOT.payload;
  if (kind === "index") return api("/api/index");
  return api(`/api/${kind}?id=${encodeURIComponent(id)}`);
}

// ---- views ----
async function route(){
  clearTimeout(timer);
  let kind = "index", id = null;
  if (LIVE) { const m = location.hash.match(/^#\/(run|pilot|forecast)\/(.+)$/); if (m) { kind = m[1]; id = decodeURIComponent(m[2]); } }
  else { kind = BOOT.view; id = BOOT.payload && BOOT.payload.id; }
  try {
    const data = await load(kind, id);
    const navigated = !current || current.kind !== kind || current.id !== id;
    current = {kind, id};
    if (kind === "index") renderIndex(data); else if (kind === "pilot") renderPilot(data);
    else if (kind === "forecast") renderForecast(data); else renderRun(data);
    if (navigated) window.scrollTo(0,0);
  } catch (err) { app.replaceChildren(panel("Error", "", h("p", {}, String(err.message || err)))); }
}

async function act(body){
  try {
    const job = await api("/api/action", body);
    toast(`${body.action}: started (job ${job.job_id})`);
    const poll = async () => {
      const j = await api(`/api/job?id=${encodeURIComponent(job.job_id)}`);
      if (j.state === "running") { setTimeout(poll, 1500); if (current && current.kind === "index") route(); return; }
      toast(`${body.action}: ${j.state}${j.message ? " · " + j.message : ""}`, j.state === "done" ? "" : "bad");
      route();
    };
    setTimeout(poll, 800);
  } catch (err) { toast(`${body.action}: ${err.message}`, "bad"); }
}

function stepper(ws, status){
  const stage = ws && ws.stage;
  const at = STAGES.indexOf(stage);
  const final = ["completed", "partial", "abstained", "failed", "cancelled", "denied", "budget_exhausted"].includes(status);
  return h("div", {cls: "stepper"}, STAGES.map((st, i) => {
    let cls = "step";
    if (final) cls += i <= at ? " done" : "";
    else if (i < at) cls += " done"; else if (i === at) cls += status === "paused" ? " stop" : " now";
    return h("div", {cls}, st.replace("_", " "));
  }));
}

function runActions(d){
  if (!LIVE) return null;
  const ws = d.workflow || {}, st = d.summary.status, id = d.id, pause = ws.pause || {};
  const btns = [];
  if (st === "paused" && pause.kind === "authorization") {
    btns.push(h("button", {cls: "btn danger", on: {click: () => act({action: "deny", run_id: id})}}, "Deny paid execution"));
    btns.push(h("span", {cls: "small muted"}, "Approve only from the command line: ", h("code", {}, `blackgrid resume ${id} --allow-paid`)));
  }
  if (st === "paused" && pause.kind === "reconciliation") {
    btns.push(h("button", {cls: "btn warnb", on: {click: () => act({action: "reconcile", run_id: id, choice: "retry"})}}, "Reconcile: retry once"));
    btns.push(h("button", {cls: "btn danger", on: {click: () => act({action: "reconcile", run_id: id, choice: "stop"})}}, "Reconcile: stop"));
  }
  if (st === "running" && !d.locked) btns.push(h("button", {cls: "btn", on: {click: () => act({action: "resume", run_id: id})}}, "Resume"));
  if (st === "running" || st === "paused") btns.push(h("button", {cls: "btn danger", on: {click: () => act({action: "cancel", run_id: id})}}, "Cancel"));
  return btns.length ? h("div", {cls: "row", style: "margin-top:12px"}, btns) : null;
}

function viewAnswer(d){
  const inv=d.investigation || {}, ws=d.workflow || {}, rec=d.record || {}, status=(d.summary || {}).status;
  const question=(d.summary || {}).question || ((d.report || {}).sections || []).find(x=>x.title==='Question')?.items?.[0]?.text || 'Network investigation';

      let evidence='In the sealed test this method reached average precision '+ap('b8')+' and '+ap('b9')+'.';
      if(c.split==='rolling'){

      }
      explanation=p.candidates+' known-node pairs were ranked with '+m+' for the next '+p.horizon_days+' days after the last observed message. '+evidence+' Scores are rankings, not probabilities, and people first seen later are not covered.';

    } else if(d.centrality){

    } else if(d.experiment){
      title=inv.verdict==='supported'?'Clustering exceeded the specified random comparison.':inv.verdict==='not_supported'?'The test did not support unusual clustering.':'The evidence is inconclusive.';
      explanation='This conclusion applies to the selected projected graph and saved decision rule. It does not establish real social groups or causality.';

function histogram(values, observed, q05, q95){
  if (!values || !values.length) return h("p", {cls: "muted"}, "No null distribution (the analysis abstained or did not run).");
  const W = 640, H = 240, L = 40, B = 34;
  const all = values.concat(observed == null ? [] : [observed]);
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.08 || 0.01; lo -= pad; hi += pad;
  const bins = 32, counts = new Array(bins).fill(0);
  values.forEach(v => counts[Math.min(Math.floor((v - lo) / (hi - lo) * bins), bins - 1)]++);
  const top = Math.max(...counts) || 1, bw = (W - L - 10) / bins, x = v => L + (v - lo) / (hi - lo) * (W - L - 10);
  const svg = s("svg", {viewBox: `0 0 ${W} ${H}`, class: "hist"});
  if (q05 != null && q95 != null) svg.appendChild(s("rect", {class: "band", x: x(q05), y: 8, width: x(q95) - x(q05), height: H - B - 8}));
  counts.forEach((c, i) => {
    const bh = c / top * (H - B - 18), a = lo + (hi - lo) * i / bins, b = lo + (hi - lo) * (i + 1) / bins;
    svg.appendChild(s("rect", {class: "bar", x: L + i * bw + 1, y: H - B - bh, width: Math.max(bw - 2, 1), height: bh,
      on: {mousemove: e => showTip(e, `${a.toFixed(3)} – ${b.toFixed(3)}: ${c} shuffled copies`), mouseleave: hideTip}}));
  });
  if (observed != null) {
    const ge = values.filter(v => v >= observed).length;
    svg.appendChild(s("line", {class: "obs", x1: x(observed), y1: 6, x2: x(observed), y2: H - B}));
    const label = `observed ${observed.toFixed(3)} · ${ge}/${values.length} nulls ≥ it`;

  const task = p.task === "repeat_pair" ? "Repeat interactions" : "New connections";
  document.getElementById("title").replaceChildren(h("h1", {}, "Forecast connections · ", task, " ", h("span", {cls: "muted mono small"}, d.id)));
  const cut = c.cutoffs || {}, prev = c.prevalence || {}, sel = c.selection || {};
  const methods = Object.keys(cut.b8 || {});
  const evalRows = methods.map(m => h("tr", {}, h("td", {cls: "mono"}, m + (m === sel.temporal ? "  ← selected temporal" : m === sel.static_reference ? "  ← selected static" : "")),
    ["b8", "b9"].map(k => h("td", {cls: "mono"}, fx(((cut[k] || {})[m] || {}).average_precision)))));
  const claims = (f.decisions || []).map(x => h("li", {}, h("span", {cls: "badge " + (x.accepted ? "ok" : "bad")}, x.accepted ? "checked" : "rejected"), " ",
    String(x.claim.text || ""), x.reasons && x.reasons.length ? h("div", {cls: "small muted"}, x.reasons.join("; ")) : null));
  const rank = (d.ranking || []).map(r => h("tr", {}, h("td", {cls: "mono"}, r.rank), h("td", {cls: "mono"}, (r.pair || []).join(" – ")), h("td", {cls: "mono"}, f3(r.score))));
  app.replaceChildren(h("div", {cls: "row", style: "margin-top:14px"}, h("span", {cls: "badge neutral"}, "Free demo · no AI call"), h("a", {href: href("index"), cls: "small", style: "margin-left:auto"}, "← all runs")),
    h("div", {cls: "grid"},
      panel("Answer", "", h("div", {cls: "notice"}, "Scores rank pairs; they are not probabilities. Pairs with people first seen after the cutoff are not covered."),
        kv([["Task", task], ["Method", p.method], ["History up to", day(p.cutoff)], ["Forecast horizon", (p.horizon_days ?? "—") + " days"],
            ["Candidate pairs", p.candidates], ["Candidate policy", p.candidate_policy], ["Known people", prof.history_nodes]]),
        h("h3", {}, "Checked statements"), h("ul", {}, claims)),
      panel("Retrospective evaluation (frozen prediction-v1, sealed test)", "", h("div", {cls: "small muted"}, `Test prevalence: b8 ${fx(prev.b8)} · b9 ${fx(prev.b9)} · mean AP difference (temporal − static): ${fx(c.mean_ap_difference)}`),
        h("div", {cls: "tablewrap"}, h("table", {}, h("thead", {}, h("tr", {}, ["Method", "AP b8", "AP b9"].map(t => h("th", {}, t)))), h("tbody", {}, evalRows)))),
      panel("Prospective forecast · top pairs (local only)", "", h("div", {cls: "small muted"}, "No realized outcome exists yet. These local identifiers never leave this computer."),
        h("div", {cls: "tablewrap"}, h("table", {}, h("thead", {}, h("tr", {}, ["Rank", "Pair", "Score"].map(t => h("th", {}, t)))), h("tbody", {}, rank))))));
}
