[project]
name = "blackgrid"
version = "1.0.0"
description = "Bounded, evidence-grounded network science with a single-host operational API."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2",
    "networkx>=3.3",
    "numpy>=2.4.6",
    "pydantic>=2.7",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
blackgrid = "blackgrid.cli:main"

[project.optional-dependencies]
methods = [
    "igraph==0.11.9",
    "leidenalg==0.10.2",
]

[dependency-groups]
benchmark = [
    "locust>=2.43,<3",
]
dev = ["pytest>=8"]
quality = [
    "mypy==1.18.2",
    "pyyaml==6.0.3",
    "ruff==0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackgrid"]

[tool.uv]
# Resolve only releases at least two weeks old as of Sprint 1 Day 2 (2026-10-17).
exclude-newer = "2026-10-03T00:00:00Z"

[tool.uv.exclude-newer-package]
# GHSA-6q48-6c7w-9gw2: targeted certificate trust-store security update.
certifi = "2026-10-22T00:00:00Z"
# Phase 7: targeted CVE-2026-114603 patch; other historical cutoffs stay frozen.
opentelemetry-api = "2026-10-23T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
